name: Deploy Power Platform Solution

on:
  workflow_dispatch:
    inputs:
      environment_url:
        description: 'Target Power Platform environment URL'
        required: true
        type: string
      solution_zip:
        description: 'Path to an exported solution zip committed or produced by your release workflow'
        required: true
        default: 'artifacts/AIInvoiceProcessingAutomation.zip'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Power Platform tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Verify solution exists
        shell: bash
        run: |
          test -f "${{ inputs.solution_zip }}" || {
            echo "Solution zip not found. Export the genuine tenant solution first.";
            exit 1;
          }

      - name: Import solution
        uses: microsoft/powerplatform-actions/import-solution@v1
        with:
          environment-url: ${{ inputs.environment_url }}
          app-id: ${{ secrets.POWERPLATFORM_APP_ID }}
          client-secret: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
          tenant-id: ${{ secrets.POWERPLATFORM_TENANT_ID }}
          solution-file: ${{ inputs.solution_zip }}
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60
